<style>
  .subscribe-button {
    /* CSS class selector */
    background-color: rgb(204, 0, 0);
    color: white;
    border: none;
    padding-left: 16px;
    padding-right: 16px;
    padding-top: 10px;
    padding-bottom: 10px;
    border-radius: 2px;
    cursor: pointer;
    margin-right: 8px;
    transition: 0.15s;
    vertical-align: top;
  }

  .subscribe-button:hover {
    opacity: 0.8;
  }

  .subscribe-button:active {
    opacity: 0.6;
  }


  .join-button {
    background-color: white;
    color: rgb(11, 71, 202);
    border: rgb(11, 71, 202) solid 1px;
    padding-left: 16px;
    padding-right: 16px;
    padding-top: 9px;
    padding-bottom: 9px;
    border-radius: 2px;
    cursor: pointer;
    margin-right: 8px;
    transition: back-groundcolor 0.13s, color 0.13s;
    vertical-align: top;
  }

  .join-button:hover {
    background-color: rgb(11, 71, 202);
    color: white
  }

  .join-button:active {
    opacity: 0.7;
  }

  .tweet-button {
    background-color: rgb(39, 136, 227);
    color: white;
    border: none;
    padding-left: 16px;
    padding-right: 16px;
    padding-top: 8px;
    padding-bottom: 8px;
    border-radius: 16px;
    font-weight: bold;
    font-size: 13px;
    cursor: pointer;
    margin-left: 8px;
    transition: box-shadow 0.15s;
    vertical-align: top;
  }

  .tweet-button:hover {
    box-shadow: 1px 1px 5px rgba(0, 0, 0, 0.4);
  }
</style>

<button class="subscribe-button">
  SUBSCRIBE
</button>

<button class="join-button">
  JOIN
</button>

<button class="tweet-button">
  Tweet
</button>
