<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <title>ARCHIVE OS v3.2</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      background: #008080;
      color: #000;
      font-family: Tahoma, 'Microsoft Sans Serif', 'MS Sans Serif', Arial, sans-serif;
      font-size: 13px;
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      cursor: default;
      user-select: none
    }

    .screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column
    }

    .screen.active {
      display: flex
    }

    /* BOOT */
    #s-boot {
      align-items: center;
      justify-content: center;
      background: #008080
    }

    .boot-box {
      border: 2px outset #dfdfdf;
      padding: 28px 44px;
      text-align: center;
      background: #c0c0c0
    }

    .boot-title {
      font-size: 22px;
      letter-spacing: 8px;
      color: #000080;
      margin-bottom: 6px;
      font-weight: bold
    }

    .boot-ver {
      font-size: 11px;
      color: #808080;
      letter-spacing: 3px;
      margin-bottom: 18px
    }

    .boot-log {
      font-size: 10px;
      color: #000;
      text-align: left;
      line-height: 1.9
    }

    .boot-log span {
      display: block
    }

    @keyframes blink {

      0%,
      49% {
        opacity: 1
      }

      50%,
      100% {
        opacity: 0
      }
    }

    .cur {
      animation: blink 1s infinite
    }

    .boot-progress {
      width: 200px;
      height: 10px;
      background: #fff;
      border: 2px inset #808080;
      margin: 10px auto 0;
      overflow: hidden
    }

    .boot-progress-fill {
      height: 100%;
      background: #000080;
      width: 0;
      transition: width .3s
    }

    /* DESKTOP */
    #s-desk {
      background: #008080
    }

    .menubar {
      background: #c0c0c0;
      border-bottom: 2px outset #dfdfdf;
      padding: 3px 10px;
      display: flex;
      justify-content: space-between;
      font-size: 10px;
      color: #000;
      letter-spacing: 1px
    }

    .desk-area {
      flex: 1;
      position: relative;
      padding: 20px;
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 8px
    }

    .d-icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      width: 76px;
      padding: 6px 4px;
      cursor: pointer;
      color: #fff;
      font-size: 10px;
      text-align: center;
      letter-spacing: .5px;
      text-shadow: 1px 1px 1px #000
    }

    .d-icon:hover,
    .d-icon.sel {
      background: rgba(0, 0, 128, .35);
      outline: 1px dotted #fff
    }

    .d-icon .ic {
      font-size: 32px;
      line-height: 1
    }

    .taskbar {
      background: #c0c0c0;
      border-top: 2px outset #dfdfdf;
      padding: 3px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 10px;
      color: #000
    }

    .tb-start {
      background: #c0c0c0;
      border: 2px outset #dfdfdf;
      padding: 2px 12px;
      cursor: pointer;
      letter-spacing: 2px;
      font-family: inherit;
      color: #000;
      font-weight: bold
    }

    .tb-start:hover {
      background: #d4d0c8
    }

    .tb-clock {
      border: 2px inset #808080;
      padding: 2px 8px;
      color: #000;
      background: #c0c0c0
    }

    /* WINDOW */
    .ww {
      position: absolute;
      background: #c0c0c0;
      border: 2px outset #dfdfdf;
      box-shadow: 1px 1px 0 #000;
      min-width: 360px
    }

    .ww-bar {
      background: #808080;
      padding: 3px 5px;
      display: flex;
      align-items: center;
      gap: 4px;
      border-bottom: none;
      cursor: move;
      color: #c0c0c0
    }

    .ww-bar.focus {
      background: #000080;
      color: #fff
    }

    .ww-ttl {
      flex: 1;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px
    }

    .ww-btn {
      width: 16px;
      height: 14px;
      background: #c0c0c0;
      border: 2px outset #dfdfdf;
      font-size: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #000
    }

    .ww-btn:hover {
      background: #d4d0c8
    }

    .ww-resize {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 12px;
      height: 12px;
      cursor: se-resize;
      background: linear-gradient(135deg, transparent 50%, #808080 50%)
    }

    /* FILE TREE */
    .ftree {
      font-size: 11px;
      line-height: 2;
      overflow-y: auto;
      padding: 8px 12px;
      background: #fff
    }

    .fi {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 1px 4px;
      cursor: pointer;
      white-space: nowrap
    }

    .fi:hover {
      background: #000080;
      color: #fff
    }

    .fi.sel {
      background: #000080;
      color: #fff;
      outline: none
    }

    .fi.corrupted .fi-ic {
      opacity: .4
    }

    .fi.corrupted .fi-nm {
      color: #808080;
      text-decoration: line-through
    }

    .fi.corrupted .fi-tag {
      color: #808080
    }

    .fi-indent {
      padding-left: 22px
    }

    .fi-indent2 {
      padding-left: 42px
    }

    .fi-ic {
      font-size: 14px
    }

    .fi-nm {
      color: #000
    }

    .fi.corrupted .fi-nm {
      color: #808080
    }

    .fi-tag {
      font-size: 9px;
      color: #808080;
      margin-left: 4px
    }

    .fi-expand {
      font-size: 9px;
      color: #808080;
      margin-left: 2px;
      min-width: 10px
    }

    /* PROPS POPUP */
    .prop-popup {
      position: absolute;
      background: #c0c0c0;
      border: 2px outset #dfdfdf;
      z-index: 200;
      min-width: 280px;
      box-shadow: 1px 1px 0 #000
    }

    .prop-bar {
      background: #000080;
      padding: 3px 6px;
      font-size: 10px;
      font-weight: bold;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: move;
      color: #fff
    }

    .prop-body {
      padding: 12px 14px;
      font-size: 11px;
      line-height: 1.9;
      color: #000
    }

    .prop-field {
      display: flex;
      gap: 6px;
      margin-bottom: 2px
    }

    .prop-label {
      color: #808080;
      min-width: 80px
    }

    .prop-val {
      color: #000
    }

    .prop-quote {
      color: #000080;
      font-style: italic;
      border-left: 2px solid #808080;
      padding-left: 8px;
      margin-top: 8px;
      line-height: 1.8;
      white-space: pre-line
    }

    /* DIALOG */
    .dlg {
      position: absolute;
      background: #c0c0c0;
      border: 2px outset #dfdfdf;
      z-index: 300;
      min-width: 300px;
      box-shadow: 1px 1px 0 #000
    }

    .dlg-bar {
      background: #000080;
      color: #fff;
      padding: 3px 8px;
      font-size: 11px;
      font-weight: bold;
      display: flex;
      justify-content: space-between;
      cursor: move
    }

    .dlg-body {
      padding: 16px 20px;
      font-size: 12px;
      line-height: 2;
      color: #000;
      white-space: pre-line
    }

    .dlg-input {
      background: #fff;
      border: 2px inset #808080;
      color: #000;
      font-family: inherit;
      font-size: 12px;
      width: 100%;
      padding: 4px 6px;
      margin-top: 8px;
      outline: none
    }

    .dlg-input:focus {
      border-color: #000080
    }

    .dlg-btns {
      padding: 0 20px 14px;
      display: flex;
      gap: 10px;
      justify-content: flex-end
    }

    .btn {
      background: #c0c0c0;
      border: 2px outset #dfdfdf;
      color: #000;
      padding: 4px 18px;
      cursor: pointer;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 1px
    }

    .btn:hover {
      background: #d4d0c8;
      color: #000
    }

    .btn:active {
      border-style: inset
    }

    .btn.primary {
      background: #c0c0c0;
      color: #000;
      font-weight: bold;
      border: 2px outset #dfdfdf
    }

    .btn.primary:hover {
      background: #d4d0c8
    }

    .btn.primary:active {
      border-style: inset
    }

    /* STATUS BARS */
    .cap-row,
    .id-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 12px;
      background: #c0c0c0;
      font-size: 10px
    }

    .cap-row {
      border-top: 1px solid #808080
    }

    .cap-label {
      color: #000;
      min-width: 72px
    }

    .cap-bar-wrap {
      flex: 1;
      height: 9px;
      background: #fff;
      border: 2px inset #808080
    }

    .cap-bar-fill {
      height: 100%;
      background: #000080;
      transition: width .3s
    }

    .cap-bar-fill.danger {
      background: #ff0000
    }

    .id-bar-fill {
      height: 100%;
      background: #808080;
      transition: width .3s
    }

    .cap-num {
      color: #000;
      min-width: 36px;
      text-align: right
    }

    /* GUIDE BANNER */
    .guide-banner {
      background: #ffffc0;
      border-bottom: 1px solid #808080;
      padding: 5px 12px;
      font-size: 10px;
      color: #000;
      letter-spacing: .5px
    }

    .guide-banner span {
      color: #000080
    }

    /* TXT VIEW */
    .txt-file {
      padding: 12px 14px;
      font-size: 11px;
      color: #000;
      line-height: 2.2;
      white-space: pre-line;
      background: #fff
    }

    .txt-file .em {
      color: #000080
    }

    /* ENDING */
    #s-end {
      align-items: center;
      justify-content: center;
      background: #008080
    }

    .end-box {
      max-width: 440px;
      width: 90%;
      font-size: 13px;
      color: #000;
      line-height: 2.6;
      text-align: left;
      background: #c0c0c0;
      border: 2px outset #dfdfdf;
      padding: 20px 28px
    }

    .end-box .headline {
      color: #000080;
      font-size: 14px;
      letter-spacing: 4px;
      margin-bottom: 18px;
      display: block;
      font-weight: bold
    }

    .end-box .divider {
      border-top: 1px solid #808080;
      margin: 16px 0
    }

    .end-box .dim {
      color: #808080;
      font-size: 10px
    }

    /* ROUND BADGE */
    .round-badge {
      font-size: 9px;
      color: #000;
      border: 2px inset #808080;
      padding: 1px 6px;
      letter-spacing: 2px;
      background: #c0c0c0
    }

    /* PIXEL ICONS via CSS */
    .px-folder::before {
      content: '▪';
      font-size: 18px;
      color: #808000
    }

    .px-folder-open::before {
      content: '▫';
      font-size: 18px;
      color: #c0c000
    }

    .px-thing::before {
      content: '◈';
      font-size: 14px;
      color: #808080
    }

    .px-txt::before {
      content: '≡';
      font-size: 15px;
      color: #000080
    }

    .px-corrupted::before {
      content: '▨';
      font-size: 15px;
      color: #808080
    }

    .px-exe::before {
      content: '▣';
      font-size: 15px;
      color: #000080
    }

    .px-readonly::before {
      content: '◌';
      font-size: 14px;
      color: #808080
    }

    /* SHAKE */
    @keyframes shake {

      0%,
      100% {
        transform: translateX(0)
      }

      15% {
        transform: translateX(-6px)
      }

      30% {
        transform: translateX(5px)
      }

      45% {
        transform: translateX(-4px)
      }

      60% {
        transform: translateX(3px)
      }

      75% {
        transform: translateX(-2px)
      }

      90% {
        transform: translateX(1px)
      }
    }

    .shaking {
      animation: shake .45s ease-in-out;
    }

    /* ICON FLASH */
    @keyframes iconFlash {

      0%,
      100% {
        outline: 2px solid transparent;
        outline-offset: 2px
      }

      50% {
        outline: 2px solid #fff;
        outline-offset: 2px
      }
    }

    .icon-flash {
      animation: iconFlash 1s ease-in-out infinite
    }

    /* ENDING NOTIFICATION */
    @keyframes notifSlideIn {
      from {
        transform: translateX(calc(100% + 20px))
      }

      to {
        transform: translateX(0)
      }
    }

    .ending-notif {
      position: fixed;
      bottom: 40px;
      right: 12px;
      background: #c0c0c0;
      border: 2px outset #dfdfdf;
      box-shadow: 1px 1px 0 #000;
      padding: 0;
      min-width: 200px;
      z-index: 100000;
      transform: translateX(calc(100% + 20px));
      animation: notifSlideIn .5s ease-out forwards;
      cursor: pointer
    }

    .ending-notif-bar {
      background: #000080;
      padding: 2px 8px;
      font-size: 9px;
      color: #c0c0c0;
      letter-spacing: 2px;
      display: flex;
      justify-content: space-between;
      align-items: center
    }

    .ending-notif-body {
      padding: 10px 14px;
      font-size: 11px;
      color: #000;
      line-height: 1.8
    }

    .ending-notif-title {
      font-size: 10px;
      color: #808080;
      letter-spacing: 1px;
      margin-bottom: 4px
    }

    .ending-notif-name {
      font-size: 13px;
      color: #000;
      font-weight: bold;
      letter-spacing: 1px
    }

    /* START MENU */
    .start-menu {
      position: absolute;
      bottom: 28px;
      left: 4px;
      background: #c0c0c0;
      border: 2px outset #dfdfdf;
      z-index: 99999;
      display: none;
      min-width: 160px;
      box-shadow: 2px -1px 0 #000
    }

    .start-menu-banner {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 24px;
      background: #000080;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      color: #c0c0c0;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 3px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 0
    }

    .start-menu-items {
      margin-left: 24px
    }

    .start-menu-item {
      padding: 6px 16px 6px 8px;
      font-size: 11px;
      color: #000;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .start-menu-item:hover {
      background: #000080;
      color: #fff
    }

    .start-menu-sep {
      height: 1px;
      background: #808080;
      margin: 2px 4px 2px 0
    }

    /* SCANLINES */
    body::after {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .03) 0px, rgba(0, 0, 0, .03) 1px, transparent 1px, transparent 2px);
      pointer-events: none;
      z-index: 9999
    }

    ::-webkit-scrollbar {
      width: 16px
    }

    ::-webkit-scrollbar-track {
      background: #c0c0c0;
      border: 1px solid #808080
    }

    ::-webkit-scrollbar-thumb {
      background: #c0c0c0;
      border: 2px outset #dfdfdf
    }

    /* UNLOCK CARDS */
    .unlock-stack {
      position: fixed;
      bottom: 36px;
      right: 12px;
      z-index: 99990;
      pointer-events: none;
      display: flex;
      flex-direction: column-reverse;
      align-items: flex-end;
      gap: 5px
    }

    @keyframes unlockCardIn {
      from {
        transform: translateY(calc(100% + 5px));
        opacity: 0
      }

      to {
        transform: translateY(0);
        opacity: 1
      }
    }

    .unlock-card {
      background: #c0c0c0;
      border: 2px outset #dfdfdf;
      box-shadow: 1px 1px 0 #000;
      width: 228px;
      padding: 9px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: unlockCardIn .4s cubic-bezier(.22, .68, 0, 1.2) both
    }

    .unlock-card-icon {
      font-size: 24px;
      line-height: 1;
      flex-shrink: 0
    }

    .unlock-card-texts {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0
    }

    .unlock-card-label {
      font-size: 9px;
      color: #808080;
      letter-spacing: 1px;
      line-height: 1.4
    }

    .unlock-card-name {
      font-size: 12px;
      color: #000;
      font-weight: bold;
      letter-spacing: .5px;
      line-height: 1.4
    }
  </style>
</head>

<body>

  <!-- 开机界面 -->
  <div id="s-boot" class="screen active">
    <div class="boot-box">
      <div class="boot-title">ARCHIVE OS</div>
      <div class="boot-ver">版本 3.2 &nbsp;·&nbsp; 记忆归档管理系统</div>
      <div class="boot-progress">
        <div class="boot-progress-fill" id="bpf"></div>
      </div>
      <div class="boot-log" style="margin-top:16px;max-width:340px">
        <span id="bl1" style="display:none">正在初始化记忆子系统……</span>
        <span id="bl2" style="display:none">加载归档索引……</span>
        <span id="bl3" style="display:none">完整性检查…… <span style="color:#000080">通过</span></span>
        <span id="bl4" style="display:none">人格模块已加载。</span>
        <span id="bl5" style="display:none;color:#000080">欢迎回来。<span class="cur">_</span></span>
      </div>
    </div>
  </div>

  <!-- 轮次过渡界面 -->
  <div id="s-trans" class="screen" style="align-items:center;justify-content:center">
    <div class="boot-box">
      <div class="boot-title">ARCHIVE OS</div>
      <div class="boot-ver">记忆归档管理系统</div>
      <div class="boot-progress">
        <div class="boot-progress-fill" id="tpf"></div>
      </div>
      <div class="boot-log" style="margin-top:16px;max-width:340px" id="transLog"></div>
    </div>
  </div>

  <!-- 桌面 -->
  <div id="s-desk" class="screen">
    <div class="menubar">
      <span>ARCHIVE OS &nbsp;·&nbsp; 记忆归档管理系统</span>
      <span id="dt-time">--:--</span>
    </div>
    <div class="desk-area" id="deskArea">
      <div class="d-icon" ondblclick="openRecycle()">
        <span class="ic" id="trashIcon">🗑️</span><span>废纸篓</span>
      </div>
      <div class="d-icon" id="iconSystem" ondblclick="openSystem()">
        <span class="ic">🗂️</span><span>系统</span>
      </div>
      <div class="d-icon sel" id="iconArchive" ondblclick="startGame()">
        <span class="ic">💾</span><span id="archiveLabel">记忆归档.exe</span>
      </div>
    </div>
    <div class="taskbar">
      <div style="position:relative">
        <button class="tb-start" id="btnStart" onclick="toggleStartMenu()">▶ 开始</button>
        <div class="start-menu" id="startMenu">
          <div class="start-menu-banner">ARCHIVE OS</div>
          <div class="start-menu-items">
            <div class="start-menu-item" onclick="void(0)">📁 记忆管理器</div>
            <div class="start-menu-item" onclick="void(0)">📋 系统日志</div>
            <div class="start-menu-item" onclick="void(0)">🔍 搜索记忆</div>
            <div class="start-menu-item" onclick="void(0)">⚙ 系统设置</div>
            <div class="start-menu-item" onclick="void(0)">❓ 帮助</div>
            <div class="start-menu-sep"></div>
            <div class="start-menu-item" onclick="restartGame()">重新启动</div>
            <div class="start-menu-item" onclick="shutdownGame()">关机</div>
          </div>
        </div>
      </div>
      <span class="round-badge" id="roundBadge" style="display:none"></span>
      <span class="tb-clock" id="tbClock">--:--</span>
      <button class="btn" style="font-size:9px;padding:1px 10px;letter-spacing:1px"
        onclick="restartGame()">重新启动</button>
    </div>
  </div>

  <!-- 结局界面 -->
  <div id="s-end" class="screen">
    <div class="end-box" id="endBox"></div>
  </div>

  <script>
    // ============================================================
    //  音效
    // ============================================================
    const sfxError = new Audio('error-fizzle.wav');
    const sfxClick = new Audio('buttonclick1.wav');
    sfxError.volume = 0.5; sfxClick.volume = 0.4;
    function playError() { sfxError.currentTime = 0; sfxError.play().catch(() => { }); }
    function playClick() { sfxClick.currentTime = 0; sfxClick.play().catch(() => { }); }

    // ============================================================
    //  游戏状态
    // ============================================================
    let round = 1;
    let winZ = 10;
    let propZ = 100;
    let dlgZ = 10000;
    let expandedFolders = {};
    let deletedCount = 0;   // 用于判断结局E（旁观者）
    let notDeleteRevealed = false; // 第二轮"不要删除.txt"是否已揭示
    let trashFull = false; // 废纸篓是否有内容

    // ============================================================

    // ============================================================
    // 展开某节点时，解锁其绑定物件的子节点（按需解锁，不影响初始容量）
    function unlockItemNodes(id) {
      const m = MEMORIES[id];
      if (!m || m.deleted || m.corrupted) return;
      if (m.item && ITEMS[m.item]) {
        ITEMS[m.item].unlocks.forEach(uid => { if (MEMORIES[uid]) MEMORIES[uid].unlocked = true; });
      }
    }
    function getCapacity() {
      let c = 0;
      for (let id in MEMORIES) {
        const m = MEMORIES[id];
        if (m.deleted) continue;
        // 需要物件解锁的节点，只有已解锁才计入容量
        if (m.itemLocked && !m.unlocked) continue;
        c += m.cap;
      }
      return c;
    }
    function getIdentity() {
      // Identity Integrity = 四条 Core Chain 完成率 × 权重之和
      const chains = [
        { nodes: ['mother', 'home', 'hallway', 'dinner', 'apron', 'rain'], weight: 30 },
        { nodes: ['first_love', 'seaside', 'ferry', 'station', 'confession', 'draft_sms'], weight: 30 },
        { nodes: ['childhood', 'playground', 'grandma', 'letter', 'summer', 'kite'], weight: 25 },
        { nodes: ['university', 'dorm', 'library', 'graduation', 'club', 'activity_photo'], weight: 15 },
      ];
      let total = 0;
      chains.forEach(chain => {
        const retained = chain.nodes.filter(id => MEMORIES[id] && !MEMORIES[id].deleted).length;
        total += chain.weight * (retained / chain.nodes.length);
      });
      return Math.round(total);
    }

    function makeDraggable(el) { el.addEventListener('mousedown', e => { const target = el.closest('.dlg,.prop-popup,.ww'); _dw = target || el; _ox = e.clientX - _dw.offsetLeft; _oy = e.clientY - _dw.offsetTop; if (target) bringFront(target); }); }
    function bringFront(el) {
      // 弹窗和属性面板用 dlgZ，普通窗口用 winZ
      if (el.classList.contains('dlg') || el.classList.contains('prop-popup')) {
        el.style.zIndex = ++dlgZ;
      } else {
        el.style.zIndex = ++winZ;
      }
      document.querySelectorAll('.ww-bar,.prop-bar,.dlg-bar').forEach(b => b.classList.remove('focus'));

      if (bar) bar.classList.add('focus');

    function createWin(id, title, w, h, x, y, html, closable = true) {
      let el = document.getElementById(id);
      if (el) { el.style.display = ''; bringFront(el); return el; }
      el = document.createElement('div');
      el.className = 'ww'; el.id = id;
      el.style.cssText = `left:${x}px;top:${y}px;width:${w}px;z-index:${++winZ}`;
      const bar = document.createElement('div');
      bar.className = 'ww-bar';
      bar.innerHTML = `<span class="ww-ttl">${title}</span>`;
      if (closable) { const x = document.createElement('div'); x.className = 'ww-btn'; x.textContent = '×'; x.onclick = () => el.style.display = 'none'; bar.appendChild(x); }
      el.appendChild(bar);
      const body = document.createElement('div'); body.innerHTML = html; el.appendChild(body);
      const rh = document.createElement('div'); rh.className = 'ww-resize'; el.appendChild(rh);
      document.getElementById('deskArea').appendChild(el);
      makeDraggable(bar);
      el.addEventListener('mousedown', () => bringFront(el));
      return el;

          document.getElementById('tpf').style.width = Math.round(((i + 1) / total) * 100) + '%';

        const sysWin = document.getElementById('w-sys');
        if (sysWin) sysWin.parentNode.removeChild(sysWin);

      // 立即损坏子节点

        if (!node.children) return;
        node.children.forEach(cid => {
          const cm = MEMORIES[cid];
          if (cm) {
            if (!cm.deleted) cm.corrupted = true;
            corruptAll(cm);
          }

      corruptAll(m);
      if (cb) cb();

    function anomalyMother() {
      // 多窗口连环报错
      const errs = ['未找到相关记忆。', '该字段已被标记为空值。', '母亲不在家了。'];
      let i = 0;
      const area = document.getElementById('deskArea');
      function spawnErr() {
        if (i >= errs.length) return;
        const d = document.createElement('div');
        d.className = 'dlg';
        d.style.cssText = `left:${140 + i * 30}px;top:${120 + i * 25}px;z-index:${++dlgZ}`;
        const bar = document.createElement('div'); bar.className = 'dlg-bar';
        bar.innerHTML = `错误 <span style="cursor:pointer" onclick="this.closest('.dlg').remove()">×</span>`;
        const body = document.createElement('div'); body.className = 'dlg-body'; body.textContent = errs[i];
        const btns = document.createElement('div'); btns.className = 'dlg-btns';
        const btn = document.createElement('button'); btn.className = 'btn'; btn.textContent = '确认';
        btn.onclick = () => { d.remove(); i++; setTimeout(spawnErr, 200); };
        btns.appendChild(btn); d.appendChild(bar); d.appendChild(body); d.appendChild(btns);
        area.appendChild(d); makeDraggable(bar); d.addEventListener('mousedown', () => bringFront(d));
        shake(d);
        i++;
        setTimeout(spawnErr, 180);
      }
      // 先弹出输入框
      showDlg('系统提示',
        '正在处理记忆「母亲」……\n删除成功。\n\n请输入家庭住址以完成身份验证：',
        [{ l: '提交', fn: () => spawnErr() }],

        { text: '您的自我不足以被维持', delay: 1500 },
        { text: '正在调用默认人格模板……', delay: 1500 },
        { text: '加载中……', delay: 1500 },
        { text: '加载中……', delay: 1500 },
      ];
      showOverlayLines(lines, () => {
        setTimeout(() => {
          ov.innerHTML = '<div style="font-size:13px;color:#000;text-align:center">计算完成</div>';
          setTimeout(() => {
            ov.innerHTML = '';
            clearDesktop();
            desktopFlash(() => {
              // 桌面只剩 Citizen Template.cfg
              const area = document.getElementById('deskArea');
              const icon = document.createElement('div');
              icon.className = 'd-icon';
              icon.addEventListener('dblclick', () => openCitizenTemplate());
              icon.innerHTML = '<span class="ic" style="font-size:32px">⚙️</span><span>Citizen Template.cfg</span>';
              area.appendChild(icon);
            });
          }, 2000);
        }, 1000);
      });
    }

    function openCitizenTemplate() {
      const el = document.getElementById('w-citizen');
      if (el) { el.style.display = ''; bringFront(el); return; }
      createWin('w-citizen', 'Citizen Template.cfg', 380, 0, 120, 50, buildCitizenP1(), false);
      setTimeout(setupCitizenInputs, 100);
    }

    function buildCitizenP1() {
      return '<div style="padding:16px 20px;font-size:12px;line-height:2.2;color:#000">'
        + '<div>欢迎，数字公民。</div>'
        + '<div style="margin-top:8px">您的编号为：<span style="color:#808080">[REDACTED]</span></div>'
        + '<div style="margin-top:12px">请问，您叫什么名字？</div>'
        + '<input class="dlg-input citizen-input" data-field="名字" style="margin-bottom:10px">'
        + '<div>人格：</div>'
        + '<input class="dlg-input citizen-input" data-field="人格" style="margin-bottom:6px">'
        + '<div>记忆：</div>'
        + '<input class="dlg-input citizen-input" data-field="记忆">'
        + '<div style="text-align:right;margin-top:14px">'
        + '<button class="btn" onclick="citizenPage2()">下一页 →</button>'
        + '</div></div>';
    }

    function citizenPage2() {
      const win = document.getElementById('w-citizen');
      if (!win) return;
      win.children[1].innerHTML = '<div style="padding:16px 20px;font-size:12px;line-height:2.2;color:#000">'
        + '<div>兴趣：</div>'
        + '<input class="dlg-input citizen-input" data-field="兴趣" style="margin-bottom:6px">'
        + '<div>价值观：</div>'
        + '<input class="dlg-input citizen-input" data-field="价值观" style="margin-bottom:6px">'
        + '<div>情感模块：</div>'
        + '<input class="dlg-input citizen-input" data-field="情感模块">'
        + '</div>';
      setTimeout(setupCitizenInputs, 100);
      // 几秒后显示最终文字
      setTimeout(() => {
        showOverlayLines([{ text: '您已经被归档', delay: 0, style: 'font-size:15px;font-weight:bold;color:#000080' }]);
      }, 8000);
    }

    function setupCitizenInputs() {
      document.querySelectorAll('.citizen-input').forEach(inp => {
        if (inp._bound) return; inp._bound = true;
        inp.addEventListener('keydown', function (e) {
          e.preventDefault();
          playError();
          showDlg('[REDACTED]', '[REDACTED]，您没有' + this.dataset.field + '。', [{ l: '确认', fn: () => { } }]);
        });
      });
    }

    // ============================================================
    //  结局 C：拒绝归档
    // ============================================================
    function endingC() {
      endingReached = true;
      showEndingNotif('拒绝归档');
      const old = document.getElementById('w-game'); if (old) old.parentNode.removeChild(old);
      document.querySelectorAll('.ww,.dlg,.prop-popup').forEach(el => el.remove());
      // Archive.exe 改名为 .bak
      const lbl = document.getElementById('archiveLabel');
      if (lbl) lbl.textContent = '记忆归档.exe.bak';
      const ico = document.getElementById('iconArchive');
      if (ico) { ico.style.opacity = '0.5'; ico.ondblclick = null; }
      // 弹出通知
      setTimeout(() => {
        showDlg('结局', '系统通知\n\n归档已取消', [{
          l: '确认', fn: () => {
            // 过几秒出现诗句
            setTimeout(() => {
              showOverlayLines([
                { text: '有些东西', delay: 2000 },
                { text: '无法被压缩', delay: 2000, style: 'color:#000080' },
              ]);
            }, 1500);
          }
        }]);
      }, 1500);
    }

    // ============================================================
    //  结局 D：空档案
    // ============================================================
    function endingD() {
      endingReached = true;
      showEndingNotif('空档案');
      const old = document.getElementById('w-game'); if (old) old.parentNode.removeChild(old);
      document.querySelectorAll('.ww,.dlg,.prop-popup').forEach(el => el.remove());
      const ov = getOverlay(); ov.innerHTML = '';
      const lines = [
        { text: '您的自我检测为空', delay: 1500 },
        { text: '正在调用默认人格模板……', delay: 1500 },
        { text: '加载中……', delay: 1500 },
        { text: '加载中……', delay: 1500 },
      ];
      showOverlayLines(lines, () => {
        setTimeout(() => {
          ov.innerHTML = '<div style="font-size:13px;color:#000;text-align:center">计算失败</div>';
          setTimeout(() => {
            ov.innerHTML = '';
            clearDesktop();
            desktopFlash();
          }, 2000);
        }, 1000);
      });
    }

    // ============================================================
    //  对话框 — 使用回调注册表，避免字符串化 closure 丢失上下文
    // ============================================================
    const _cbs = {};   // { 'cbKey': fn }
    let _dlgOffset = 0;

    function _reg(fn) { const k = 'cb' + Date.now() + '_' + Math.random().toString(36).slice(2); _cbs[k] = fn; return k; }
    function _call(k, dlgEl) { if (_cbs[k]) { _cbs[k](); delete _cbs[k]; } if (dlgEl) dlgEl.remove(); }

    function showDlg(title, msg, btns, hasInput) {
      _dlgOffset = (_dlgOffset + 22) % 80;
      const d = document.createElement('div');
      d.className = 'dlg';
      d.style.cssText = `left:${155 + _dlgOffset}px;top:${130 + _dlgOffset}px;z-index:${++dlgZ}`;
      // 关闭按钮
      const bar = document.createElement('div');
      bar.className = 'dlg-bar';
      bar.innerHTML = `${title} <span style="cursor:pointer;font-weight:normal">×</span>`;
      bar.querySelector('span').onclick = () => d.remove();
      d.appendChild(bar);
      // 正文
      const body = document.createElement('div');
      body.className = 'dlg-body';
      body.style.whiteSpace = 'pre-line';
      body.textContent = msg;
      if (hasInput) {
        const inp = document.createElement('input');
        inp.className = 'dlg-input';
        inp.placeholder = '_______________';
        body.appendChild(document.createElement('br'));
        body.appendChild(inp);
      }
      d.appendChild(body);
      // 按钮行
      const row = document.createElement('div');
      row.className = 'dlg-btns';
      btns.forEach(b => {
        const btn = document.createElement('button');
        btn.className = 'btn' + (b.primary ? ' primary' : '');
        btn.textContent = b.l;
        const key = _reg(b.fn);
        btn.addEventListener('click', () => _call(key, d));
        row.appendChild(btn);
      });
      d.appendChild(row);
      document.getElementById('deskArea').appendChild(d);
      makeDraggable(bar);
      d.addEventListener('mousedown', () => bringFront(d));
      return d;
    }

    // ============================================================
    //  不要删除.txt
    // ============================================================
    function openNotDelete() {
      createWin('w-notdel', '不要删除.txt', 310, 0, 260, 130, `<div class="txt-file"><span class="em">如果你能看到这份文件，</span>
说明你已经意识到：

<span class="em">容量不是价值。</span>

——

这份文件本身占用 0% 容量。

你可以留着它。</div>`);
    }

    // ============================================================
    //  解锁物件卡片（第二、三轮开头）
    // ============================================================
    function getUnlockCardsForRound(r) {
      const cards = [];
      if (r === 2) {
        // 第二轮：四件核心物件，对应核心记忆是否存活
        [
          { core: 'mother', item: 'old_key' },
          { core: 'first_love', item: 'old_phone' },
          { core: 'university', item: 'student_id' },
          { core: 'childhood', item: 'paper_envelope' },
        ].forEach(({ core, item }) => {
          if (!MEMORIES[core].deleted) cards.push({ itemId: item, itemName: ITEMS[item].name });
        });
      } else if (r === 3) {
        // 第三轮：v1.1 新物件，条件是对应子节点存活且未损坏
        if (!MEMORIES['station'].deleted && !MEMORIES['station'].corrupted)
          cards.push({ itemId: 'train_ticket', itemName: ITEMS['train_ticket'].name });
        if (!MEMORIES['graduation'].deleted && !MEMORIES['graduation'].corrupted)
          cards.push({ itemId: 'report_card', itemName: ITEMS['report_card'].name });
      }
      return cards;
    }

    function showUnlockCards(r) {
      const old = document.getElementById('unlock-card-stack');
      if (old) old.remove();

      const cards = getUnlockCardsForRound(r);
      if (!cards.length) return;

      const stack = document.createElement('div');
      stack.className = 'unlock-stack';
      stack.id = 'unlock-card-stack';
      document.body.appendChild(stack);

      const GAP = 520; // ms between cards
      cards.forEach((card, i) => {
        setTimeout(() => {
          const el = document.createElement('div');
          el.className = 'unlock-card';
          el.innerHTML =
            '<span class="unlock-card-icon">📦</span>'
            + '<span class="unlock-card-texts">'
            + '<span class="unlock-card-label">解锁物件</span>'
            + '<span class="unlock-card-name">' + card.itemName + '</span>'
            + '</span>';
          stack.appendChild(el);
        }, 600 + i * GAP);
      });

      // 全部显示完 4 秒后淡出消失
      const fadeAt = 600 + cards.length * GAP + 4000;
      setTimeout(() => {
        if (!stack.isConnected) return;
        stack.style.transition = 'opacity .5s';
        stack.style.opacity = '0';
        setTimeout(() => stack.remove(), 520);
      }, fadeAt);
    }

    // ============================================================
    //  启动
    // ============================================================
    boot();
  </script>
</body>
